<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ==========================================================
         Meta
         ========================================================== -->

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <!-- ==========================================================
         Page Information
         ========================================================== -->

    <title>Tic-Tac-Toe | X O Game</title>

    <meta name="description" content="A modern and interactive Tic-Tac-Toe game built with HTML, CSS and JavaScript.">


    <!-- ==========================================================
         Google Fonts
         ========================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">


    <!-- ==========================================================
         CSS
         ========================================================== -->

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- ==========================================================
         Background Decoration
         ========================================================== -->

    <div class="background-glow background-glow-one"></div>

    <div class="background-glow background-glow-two"></div>


    <!-- ==========================================================
         Main Game
         ========================================================== -->

    <main class="game-container">


        <!-- ======================================================
             Game Header
             ====================================================== -->

        <header class="game-header">

            <div class="brand">

                <div class="brand-icon">
                    XO
                </div>

                <div class="brand-text">

                    <span class="brand-small">
                        CLASSIC GAME
                    </span>

                    <h1>
                        Tic-Tac-Toe
                    </h1>

                </div>

            </div>


            <button class="new-game-button" id="newGameButton" type="button">

                <span class="button-icon">
                    ↻
                </span>

                New Game

            </button>

        </header>


        <!-- ======================================================
             Score Board
             ====================================================== -->

        <section class="score-board">


            <!-- ==================================================
                 Player X
                 ================================================== -->

            <div class="player-card player-x active" id="playerXCard">

                <div class="player-info">

                    <div class="player-symbol x-symbol">
                        X
                    </div>

                    <div>

                        <span class="player-label">
                            PLAYER
                        </span>

                        <h2>
                            Player X
                        </h2>

                    </div>

                </div>


                <div class="player-score" id="scoreX">
                    0
                </div>

            </div>


            <!-- ==================================================
                 VS
                 ================================================== -->

            <div class="versus">
                VS
            </div>


            <!-- ==================================================
                 Player O
                 ================================================== -->

            <div class="player-card player-o" id="playerOCard">

                <div class="player-info">

                    <div class="player-symbol o-symbol">
                        O
                    </div>

                    <div>

                        <span class="player-label">
                            PLAYER
                        </span>

                        <h2>
                            Player O
                        </h2>

                    </div>

                </div>


                <div class="player-score" id="scoreO">
                    0
                </div>

            </div>

        </section>


        <!-- ======================================================
             Turn Indicator
             ====================================================== -->

        <section class="turn-container">

            <div class="turn-indicator">

                <span class="turn-dot"></span>

                <span>
                    <span id="turnText">Player X</span>
                    's turn
                </span>

            </div>

        </section>


        <!-- ======================================================
             Game Board
             ====================================================== -->

        <section class="game-board" id="gameBoard" aria-label="Tic-Tac-Toe board">

            <button class="cell" data-index="0" type="button" aria-label="Cell 1"></button>

            <button class="cell" data-index="1" type="button" aria-label="Cell 2"></button>

            <button class="cell" data-index="2" type="button" aria-label="Cell 3"></button>


            <button class="cell" data-index="3" type="button" aria-label="Cell 4"></button>

            <button class="cell" data-index="4" type="button" aria-label="Cell 5"></button>

            <button class="cell" data-index="5" type="button" aria-label="Cell 6"></button>


            <button class="cell" data-index="6" type="button" aria-label="Cell 7"></button>

            <button class="cell" data-index="7" type="button" aria-label="Cell 8"></button>

            <button class="cell" data-index="8" type="button" aria-label="Cell 9"></button>

        </section>


        <!-- ======================================================
             Game Result
             ====================================================== -->

        <section class="result-panel" id="resultPanel" aria-live="polite">

            <div class="result-icon" id="resultIcon">
                ✓
            </div>

            <div class="result-content">

                <span class="result-label">
                    GAME OVER
                </span>

                <h2 id="resultTitle">
                    Player X Wins!
                </h2>

                <p id="resultMessage">
                    Great move! Ready for another round?
                </p>

            </div>

            <button class="play-again-button" id="playAgainButton" type="button">
                Play Again
            </button>

        </section>


        <!-- ======================================================
             Footer
             ====================================================== -->

        <footer class="game-footer">

            <p>
                Built with
                <span>HTML</span>,
                <span>CSS</span> &
                <span>JavaScript</span>
            </p>

        </footer>

    </main>


    <!-- ==========================================================
         JavaScript
         ========================================================== -->

    <script src="logic.js"></script>

</body>

</html>
